<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Hours</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --text: #1c1c1e;
    --sub: #8e8e93;
    --border: rgba(60,60,67,0.12);
    --blue: #007aff;
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 17px; }
  .page { max-width: 430px; margin: 0 auto; padding-bottom: 40px; }

  .topbar { padding: 20px 20px 14px; }
  .topbar-date { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .topbar-day { font-size: 15px; color: var(--sub); margin-top: 2px; }

  /* Year total card */
  .year-card { margin: 0 16px 14px; background: var(--surface); border-radius: var(--radius); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
  .year-label { font-size: 14px; color: var(--sub); margin-bottom: 3px; }
  .year-value { font-size: 32px; font-weight: 700; letter-spacing: -1px; color: var(--text); }
  .year-unit { font-size: 16px; font-weight: 400; color: var(--sub); margin-left: 4px; }
  .year-icon { width: 44px; height: 44px; border-radius: 11px; background: #e8f0fe; display: flex; align-items: center; justify-content: center; }
  .year-icon svg { width: 24px; height: 24px; stroke: #1a56db; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .card { background: var(--surface); border-radius: var(--radius); margin: 0 16px 12px; overflow: hidden; }
  .field { padding: 13px 16px; border-top: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .field:first-child { border-top: none; }
  .field label { font-size: 15px; color: var(--sub); min-width: 80px; }
  .field input { border: none; outline: none; font-size: 17px; font-family: var(--font); color: var(--text); background: none; text-align: right; flex: 1; min-width: 0; }
  .field input::placeholder { color: #c7c7cc; }

  .save-btn { display: block; margin: 4px 16px 16px; padding: 16px; background: var(--blue); color: #fff; border: none; border-radius: var(--radius); font-size: 17px; font-weight: 600; cursor: pointer; width: calc(100% - 32px); letter-spacing: -0.2px; }
  .save-btn:active { opacity: 0.85; }
  .save-btn:disabled { opacity: 0.5; }

  .section-label { font-size: 13px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 20px 4px; }

  .today-pill { display: inline-flex; align-items: center; background: #e8f8ed; color: #1a7a34; font-size: 14px; font-weight: 600; padding: 5px 14px; border-radius: 20px; margin: 0 16px 8px; }

  .entry { padding: 12px 16px; border-top: 0.5px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .entry:first-child { border-top: none; }
  .entry-info { flex: 1; min-width: 0; }
  .entry-desc { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-time { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .entry-hrs { font-size: 17px; font-weight: 600; white-space: nowrap; }

  .setup-banner { background: #fff3cd; border-radius: var(--radius); margin: 0 16px 12px; padding: 14px 16px; font-size: 14px; color: #856404; line-height: 1.5; }
  .setup-banner b { font-weight: 600; }
  .setup-banner .url-input { margin-top: 10px; width: 100%; border: 1px solid #ffc107; border-radius: 8px; padding: 8px 10px; font-size: 14px; background: #fff; color: #333; }
  .setup-banner .url-save { margin-top: 8px; background: #ffc107; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }

  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { padding: 20px 16px; color: var(--sub); font-size: 15px; text-align: center; }
  .shimmer { color: var(--sub); font-size: 32px; font-weight: 700; }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="topbar-date" id="topbar-date"></div>
    <div class="topbar-day" id="topbar-day"></div>
  </div>

  <div id="setup-section"></div>

  <div class="card">
    <div class="field">
      <label>What</label>
      <input type="text" id="f-desc" placeholder="work done" autocomplete="off">
    </div>
    <div class="field">
      <label>Start</label>
      <input type="time" id="f-start">
    </div>
    <div class="field">
      <label>End</label>
      <input type="time" id="f-end">
    </div>
  </div>

  <button class="save-btn" id="save-btn" onclick="saveEntry()">Save entry</button>

  <div class="year-card">
    <div>
      <div class="year-label" id="year-label">Loading…</div>
      <div>
        <span class="year-value" id="year-value">—</span>
        <span class="year-unit" id="year-unit"></span>
      </div>
    </div>
    <div class="year-icon">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </div>
  </div>

  <div id="today-section"></div>

</div>

<script>
const STORAGE_KEY = 'hours_script_url';
let SCRIPT_URL = localStorage.getItem(STORAGE_KEY) || '';

const today = new Date();
const isoDate = today.toISOString().slice(0, 10);
const thisYear = String(today.getFullYear());
const hh = String(today.getHours()).padStart(2, '0');
const mm = String(today.getMinutes()).padStart(2, '0');

const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
document.getElementById('topbar-date').textContent = today.getDate() + ' ' + months[today.getMonth()];
document.getElementById('topbar-day').textContent = days[today.getDay()] + ' ' + today.getFullYear();

document.getElementById('f-start').value = hh + ':' + mm;
document.getElementById('f-end').value = hh + ':' + mm;

function renderSetup() {
  const el = document.getElementById('setup-section');
  if (SCRIPT_URL) { el.innerHTML = ''; return; }
  el.innerHTML =
    '<div class="setup-banner">' +
    '<b>One-time setup:</b> paste your Google Apps Script URL below.' +
    '<input class="url-input" id="url-input" type="url" placeholder="https://script.google.com/macros/s/...">' +
    '<button class="url-save" onclick="saveUrl()">Save URL</button>' +
    '</div>';
}

function saveUrl() {
  const val = document.getElementById('url-input').value.trim();
  if (!val.startsWith('https://script.google.com')) { alert('Please paste a valid Apps Script URL'); return; }
  SCRIPT_URL = val;
  localStorage.setItem(STORAGE_KEY, val);
  renderSetup();
  loadData();
}

async function saveEntry() {
  if (!SCRIPT_URL) { alert('Please add your Apps Script URL first'); return; }
  const desc = document.getElementById('f-desc').value.trim();
  const start = document.getElementById('f-start').value;
  const end = document.getElementById('f-end').value;
  if (!desc) { document.getElementById('f-desc').focus(); return; }
  if (!start || !end) { alert('Please set start and end time'); return; }

  const btn = document.getElementById('save-btn');
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled = true;

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({ date: isoDate, desc, start, end })
    });
    document.getElementById('f-desc').value = '';
    const now2 = new Date();
    document.getElementById('f-end').value = String(now2.getHours()).padStart(2,'0') + ':' + String(now2.getMinutes()).padStart(2,'0');
    setTimeout(loadData, 1200);
  } catch(e) {
    alert('Error saving. Check your script URL.');
  }
  btn.innerHTML = 'Save entry';
  btn.disabled = false;
}

async function loadData() {
  if (!SCRIPT_URL) {
    document.getElementById('year-label').textContent = 'Set up script URL to track hours';
    return;
  }
  try {
    const r = await fetch(SCRIPT_URL + '?date=' + isoDate + '&year=' + thisYear);
    const data = await r.json();
    renderYearTotal(data.yearTotal || 0);
    renderToday(data.entries || []);
  } catch(e) {
    document.getElementById('year-label').textContent = 'Could not load';
    document.getElementById('today-section').innerHTML = '<div class="empty">Could not load entries</div>';
  }
}

function renderYearTotal(total) {
  document.getElementById('year-label').textContent = thisYear + ' total';
  document.getElementById('year-value').textContent = total.toFixed(1);
  document.getElementById('year-unit').textContent = 'hrs';
}

function renderToday(entries) {
  const el = document.getElementById('today-section');
  if (!entries.length) { el.innerHTML = '<div class="empty">No entries today yet</div>'; return; }
  const total = entries.reduce(function(s, e) { return s + parseFloat(e.hours || 0); }, 0);
  let html = '<div class="section-label">Today</div>' +
    '<div class="today-pill">' + total.toFixed(2) + ' hrs today</div>' +
    '<div class="card">';
  entries.forEach(function(e) {
    html += '<div class="entry">' +
      '<div class="entry-info">' +
      '<div class="entry-desc">' + e.desc + '</div>' +
      '<div class="entry-time">' + e.start + ' – ' + e.end + '</div>' +
      '</div>' +
      '<div class="entry-hrs">' + parseFloat(e.hours).toFixed(2) + 'h</div>' +
      '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

renderSetup();
loadData();
</script>
</body>
</html>
